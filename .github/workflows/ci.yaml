name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Integration tests run a real IMAP server (GreenMail) in Docker via
  # testcontainers. Kept as a separate, independently-disableable job so the
  # fast `checks` job stays the required status check for merge. Turn off by
  # setting the repository variable RUN_INTEGRATION to 'false'.
  integration:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_INTEGRATION != 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # Confirms the Dockerfile actually builds and the resulting image boots
  # and serves traffic. There's no reliable way to verify this outside CI
  # (it requires a real Docker daemon), so this is the source of truth for
  # "does the Dockerfile work," not just a nice-to-have.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mail-tool-server:ci .

      - name: Start container
        run: |
          echo '{"accounts": []}' > /tmp/ci-config.json
          docker run -d --name mail-tool-server-ci \
            -p 3000:3000 -p 3001:3001 \
            -v /tmp/ci-config.json:/app/config.json \
            -e CONFIG_PATH=/app/config.json \
            mail-tool-server:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              echo "HTTP health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "HTTP health check did not pass within 20s"
              exit 1
            fi
            sleep 1
          done

      - name: Check MCP endpoint responds
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/mcp)
          if [ "$status" != "405" ]; then
            echo "Expected 405 from GET /mcp, got $status"
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs mail-tool-server-ci

      - name: Stop container
        if: always()
        run: docker rm -f mail-tool-server-ci
