name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    semver-increment: major
    when:
      label: 'breaking-change'
  - title: '🚀 Features'
    semver-increment: minor
    when:
      label: 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      label: 'bug'
  - title: '📝 Documentation'
    when:
      label: 'documentation'
  # Catches every other default GitHub label. A PR with none of the labels
  # in this file at all still gets included in $CHANGES, just without a
  # category heading (release-drafter has no true wildcard/catch-all
  # changelog category) — it still gets at least a patch version bump,
  # since the resolver defaults to patch when nothing more severe matched.
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'duplicate'
        - 'good first issue'
        - 'help wanted'
        - 'invalid'
        - 'question'
        - 'wontfix'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## What's Changed

  $CHANGES

  ## Docker image

  ```
  docker pull ghcr.io/nielssj/mail-tool-server:v$RESOLVED_VERSION
  ```
